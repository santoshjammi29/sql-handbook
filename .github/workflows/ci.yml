name: CI SQL Validation & Integrity Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: SQL Integrity & Execution Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SQL Integrity Verification
        run: |
          python tests/test_sql_integrity.py

      - name: Run SQL Execution & Assertion Runner
        run: |
          python tests/test_sql_execution.py

      - name: Run Full Exercise Suite
        run: |
          python scripts/run_all_exercises.py --quiet
