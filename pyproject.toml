[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-handbook"
version = "1.0.0"
description = "The SQL Handbook: 105 Production Coding Use Cases, Query Optimization Recipes, MPP Architectures & Incident Runbooks"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Santosh Jammi" }
]
classifiers = [
    "Programming Language :: SQL",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "tabulate>=0.9.0",
    "duckdb>=0.10.0",
    "sqlparse>=0.4.4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
